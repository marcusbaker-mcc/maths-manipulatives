<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:20px auto;padding:20px}
.controls{margin-bottom:15px}
button{padding:10px 16px;margin-right:8px;border:none;border-radius:8px;background:#2563eb;color:white;cursor:pointer}
#reset{background:#6b7280}
#message{background:#f1f5f9;padding:12px;border-radius:8px;margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.cell{height:50px;display:flex;align-items:center;justify-content:center;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-weight:bold}
.crossed{background:#fecaca;color:#666;text-decoration:line-through}
.current{background:#22c55e;color:white}
.selected{background:#fde047}
.primes{margin-top:20px;padding:12px;background:#dcfce7;border-radius:8px;display:none}
